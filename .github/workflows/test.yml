# 纯逻辑 + mock 冒烟（node test/run-node.mjs）
# 无 npm 依赖安装；与本地 `npm test` 一致
# 版本短哈希不由 CI 回写仓库；CF Pages 构建时 tools/inject-deploy-hash.mjs 注入
#
# 分支保护 required check 名：**Test**（本 job 的 name）。
# 以后加测：在本 job 里加 step（或 matrix），保持 job name 仍为 Test，不必再拆并列 job。
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Run tests
        run: npm test
