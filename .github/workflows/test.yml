# 纯逻辑 + mock 冒烟（node test/run-node.mjs）+ Playwright e2e（test/e2e）
# 版本短哈希不由 CI 回写仓库；CF Pages 构建时 tools/inject-deploy-hash.mjs 注入
#
# 分支保护 required checks：**Test**（逻辑）+ **E2E**（Playwright）+ CodeRabbit。
# 以后加测：逻辑进 test job，浏览器 e2e 进 e2e job。
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Run logic tests
        run: npm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-results
          path: test-results
          retention-days: 7
