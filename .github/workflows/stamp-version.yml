# 在 Test 工作流成功之后，把 js/version.js 的 GIT_HASH 写成「被测内容提交」的短哈希并推回 main。
# 与 test.yml 拆分：避免同一 concurrency 组 cancel-in-progress 打断 stamp，也避免 stamp push 再进 Test 时互相踩。
#
# 规则：
# - 仅 Test 成功 + 来源为 push 到 main
# - 触发提交说明含 [version-stamp] 则跳过（防环）
# - 写入的 hash = workflow_run.head_sha（内容提交），不是 stamp 提交自身
name: Stamp version hash

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: stamp-version-main
  cancel-in-progress: false

jobs:
  stamp:
    name: Write GIT_HASH
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # workflow_run 的 head_branch 在 push 时为分支名
    if: >
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if already a stamp commit
        id: gate
        run: |
          set -e
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          MSG=$(git log -1 --format=%B "$HEAD_SHA" 2>/dev/null || true)
          echo "head_sha=$HEAD_SHA"
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if echo "$MSG" | grep -q '\[version-stamp\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skip: head commit is already a version-stamp"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Stamp GIT_HASH from content commit
        if: steps.gate.outputs.skip != 'true'
        id: stamp
        run: |
          set -e
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT=$(echo "$HEAD_SHA" | cut -c1-7 | tr 'A-F' 'a-f')
          echo "Stamping GIT_HASH=$SHORT (content $HEAD_SHA)"
          OUT=$(node tools/stamp-git-hash.mjs "$HEAD_SHA")
          echo "stamp: $OUT"
          if echo "$OUT" | grep -q '^unchanged'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.gate.outputs.skip != 'true' && steps.stamp.outputs.changed == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/version.js
          git commit -m "chore: stamp GIT_HASH ${{ steps.stamp.outputs.short }} [version-stamp]"
          # 先 commit 再 rebase，避免未暂存改动被 pull 弄丢
          git pull --rebase origin main
          git push origin HEAD:main
